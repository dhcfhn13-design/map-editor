<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>世界征服者式 - 地图编辑器</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:0; background:#1e1e1e; color:#ddd;
    font-family:-apple-system,"Segoe UI",sans-serif; display:flex; height:100vh; }
  #sidebar { width:320px; background:#252526; display:flex; flex-direction:column;
    border-right:1px solid #333; }
  #sidebar h2 { font-size:14px; padding:10px; margin:0; background:#2d2d30;
    border-bottom:1px solid #333; }
  .tabs { display:flex; background:#2d2d30; }
  .tab { flex:1; padding:8px; text-align:center; cursor:pointer;
    font-size:13px; border-bottom:2px solid transparent; }
  .tab.active { background:#1e1e1e; border-bottom-color:#007acc; }
  #tileList { flex:1; overflow-y:auto; padding:8px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:4px; align-content:start; }
  .tile-item { background:#333; border:2px solid transparent; cursor:pointer;
    padding:2px; display:flex; align-items:center; justify-content:center;
    position:relative; min-height:60px; overflow:hidden; }
  .tile-item:hover { background:#444; }
  .tile-item.selected { border-color:#ffd700; background:#444; }
  .tile-item canvas { max-width:100%; max-height:100%; image-rendering:pixelated; }
  .tile-item .name { position:absolute; bottom:0; left:0; right:0; font-size:9px;
    text-align:center; background:rgba(0,0,0,0.7); padding:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #main { flex:1; display:flex; flex-direction:column; }
  #toolbar { background:#2d2d30; padding:8px; display:flex; gap:10px;
    align-items:center; border-bottom:1px solid #333; font-size:13px; flex-wrap:wrap; }
  #toolbar input, #toolbar button, #toolbar select {
    background:#3c3c3c; color:#ddd; border:1px solid #555; padding:4px 8px; font-size:12px; }
  #toolbar button { cursor:pointer; }
  #toolbar button:hover { background:#4c4c4c; }
  #toolbar button.primary { background:#0e639c; border-color:#0e639c; }
  #toolbar button.primary:hover { background:#1177bb; }
  #toolbar button.danger { background:#a02525; border-color:#a02525; }
  #mapViewport { flex:1; overflow:auto; position:relative; background:#111; }
  #mapCanvas { display:block; image-rendering:pixelated; cursor:crosshair; }
#status { background:#007acc; color:white; padding:4px 10px; font-size:12px; }
  #rightbar { width:200px; background:#252526; padding:10px;
    border-left:1px solid #333; font-size:12px; }
  #rightbar h3 { font-size:12px; margin:10px 0 5px; color:#4ec9b0; }
  #rightbar .info { margin:3px 0; }
  #rightbar .info span { color:#ce9178; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>图块选择</h2>
  <div class="tabs">
    <div class="tab active" data-tab="plant">植物/基础</div>
    <div class="tab" data-tab="terrain">山地</div>
  </div>
  <div id="tileList"></div>
</div>

<div id="main">
  <div id="toolbar">
    <label>地图: <input type="number" id="inpW" value="20" min="1" max="200" style="width:50px"> × 
      <input type="number" id="inpH" value="15" min="1" max="200" style="width:50px"></label>
    <button id="btnResize">应用尺寸</button>
    <label>图层: 
      <select id="selLayer">
        <option value="terrain">地形层</option>
        <option value="plants">植物层(叠加)</option>
        <option value="erase">橡皮擦</option>
      </select>
    </label>
    <label>缩放: <input type="range" id="inpZoom" min="20" max="100" value="50" style="width:100px"></label>
    <button id="btnExport" class="primary">💾 导出 map.bin</button>
    <button id="btnImport">📂 导入</button>
    <input type="file" id="fileImport" accept=".bin,.json" style="display:none">
    <button id="btnClear" class="danger">🗑️ 清空</button>
  </div>
  <div id="mapViewport">
    <canvas id="mapCanvas"></canvas>
  </div>
  <div id="status">就绪</div>
</div>
<div id="rightbar">
  <h3>当前选中</h3>
  <div class="info">图块: <span id="infoTile">-</span></div>
  <div class="info">名称: <span id="infoName">-</span></div>
  <h3>鼠标位置</h3>
  <div class="info">格坐标: <span id="infoGrid">-</span></div>
  <div class="info">地形: <span id="infoTerrain">-</span></div>
  <div class="info">植物: <span id="infoPlants">-</span></div>
</div>

<script>
const TILE_SIZE = 62;
let MAP_WIDTH = 20;
let MAP_HEIGHT = 15;
let VIEW_SCALE = 0.5;

let textures = {};
let atlases = {};
let currentTool = { group:null, name:null, layer:'terrain' };
let tiles = [];
let currentTab = 'plant';
let isDrawing = false;

async function loadTexture(path) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('加载失败: ' + path));
    img.src = path;
  });
}

async function loadXML(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + path);
  const text = await res.text();
  return new DOMParser().parseFromString(text, 'application/xml');
}

function parseAtlas(xmlDoc) {
  const dict = {};
  xmlDoc.querySelectorAll('Image').forEach(el => {
    const name = el.getAttribute('name').replace('.png', '');
    const w = parseInt(el.getAttribute('w'));
    const h = parseInt(el.getAttribute('h'));
    if (w <= 0 || h <= 0) return;
    dict[name] = {
      x: parseInt(el.getAttribute('x')),
      y: parseInt(el.getAttribute('y')),
      w, h,
      refx: parseInt(el.getAttribute('refx')),
      refy: parseInt(el.getAttribute('refy'))
    };
  });
  return dict;
}

async function loadAllResources() {
  setStatus('正在加载资源...');
  try {
    textures.plant = await loadTexture('assets/plant.webp');
    atlases.plant = parseAtlas(await loadXML('assets/plant.xml'));
    console.log('plant:', Object.keys(atlases.plant).length, '图块');
  } catch (e) { console.error('plant 加载失败', e); }
  try {
    textures.terrain = await loadTexture('assets/terrain.png');
    atlases.terrain = parseAtlas(await loadXML('assets/terrain.xml'));
    console.log('terrain:', Object.keys(atlases.terrain).length, '图块');
  } catch (e) { console.error('terrain 加载失败', e); }
  setStatus('资源加载完成');
}

function renderTileList() {
  const container = document.getElementById('tileList');
  container.innerHTML = '';
  const atlas = atlases[currentTab];
  const tex = textures[currentTab];
  if (!atlas || !tex) {
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:#888;">未加载</div>';
    return;
  }
  const names = Object.keys(atlas).sort();
  for (const name of names) {
    const info = atlas[name];
    const div = document.createElement('div');
    div.className = 'tile-item';
    const cv = document.createElement('canvas');
    const maxSize = 60;
    const scale = Math.min(maxSize/info.w, maxSize/info.h, 1);
    cv.width = info.w * scale;
    cv.height = info.h * scale;
    const cx = cv.getContext('2d');
    cx.imageSmoothingEnabled = false;
    cx.drawImage(tex, info.x, info.y, info.w, info.h, 0, 0, cv.width, cv.height);
    div.appendChild(cv);
    const lbl = document.createElement('div');
    lbl.className = 'name';
    lbl.textContent = name;
    div.appendChild(lbl);
    div.addEventListener('click', () => {
      document.querySelectorAll('.tile-item').forEach(x => x.classList.remove('selected'));
      div.classList.add('selected');
      currentTool.group = currentTab;
      currentTool.name = name;
      updateInfoPanel();
    });
    container.appendChild(div);
  }
}

const mapCanvas = document.getElementById('mapCanvas');
const ctx = mapCanvas.getContext('2d');

function resizeCanvas() {
  mapCanvas.width = MAP_WIDTH * TILE_SIZE;
  mapCanvas.height = MAP_HEIGHT * TILE_SIZE;
  mapCanvas.style.width = (MAP_WIDTH * TILE_SIZE * VIEW_SCALE) + 'px';
  mapCanvas.style.height = (MAP_HEIGHT * TILE_SIZE * VIEW_SCALE) + 'px';
}

function initMap() {
  tiles = [];
  for (let y = 0; y < MAP_HEIGHT; y++) {
    const row = [];
    for (let x = 0; x < MAP_WIDTH; x++) {
      row.push({ terrain:'sea', plants:[] });
    }
    tiles.push(row);
  }
}


function redrawMap() {
  ctx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
  ctx.imageSmoothingEnabled = false;
  for (let y = 0; y < MAP_HEIGHT; y++)
    for (let x = 0; x < MAP_WIDTH; x++)
      drawTileAt(ctx, x*TILE_SIZE, y*TILE_SIZE, tiles[y][x].terrain, false);
  for (let y = 0; y < MAP_HEIGHT; y++)
    for (let x = 0; x < MAP_WIDTH; x++)
      for (const p of tiles[y][x].plants)
        drawTileAt(ctx, x*TILE_SIZE, y*TILE_SIZE, p, true);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= MAP_WIDTH; x++) {
    ctx.beginPath(); ctx.moveTo(x*TILE_SIZE, 0);
    ctx.lineTo(x*TILE_SIZE, MAP_HEIGHT*TILE_SIZE); ctx.stroke();
  }
  for (let y = 0; y <= MAP_HEIGHT; y++) {
    ctx.beginPath(); ctx.moveTo(0, y*TILE_SIZE);
    ctx.lineTo(MAP_WIDTH*TILE_SIZE, y*TILE_SIZE); ctx.stroke();
  }
}

function drawTileAt(c, px, py, name, isOverlay) {
  const info = findTile(name);
  if (!info) return;
  const tex = textures[info.group];
  let ax, ay;
  if (isOverlay) {
    ax = px + TILE_SIZE/2 - info.refx;
    ay = py + TILE_SIZE/2 - info.refy;
  } else {
    ax = px - info.refx;
    ay = py - info.refy;
  }
  c.drawImage(tex, info.x, info.y, info.w, info.h, ax, ay, info.w, info.h);
}

function findTile(name) {
  for (const g in atlases)
    if (atlases[g][name]) return { group:g, ...atlases[g][name] };
  return null;
}

function canvasCoordsToGrid(evt) {
  const rect = mapCanvas.getBoundingClientRect();
  const cx = (evt.clientX - rect.left) / VIEW_SCALE;
  const cy = (evt.clientY - rect.top) / VIEW_SCALE;
  return { gx: Math.floor(cx/TILE_SIZE), gy: Math.floor(cy/TILE_SIZE) };
}

function paintAt(gx, gy) {
  if (gx < 0 || gx >= MAP_WIDTH || gy < 0 || gy >= MAP_HEIGHT) return;
  const layer = document.getElementById('selLayer').value;
  const cell = tiles[gy][gx];
  if (layer === 'erase') {
    cell.terrain = 'sea'; cell.plants = [];
  } else if (layer === 'terrain') {
    if (!currentTool.name) return;
    cell.terrain = currentTool.name;
  } else if (layer === 'plants') {
    if (!currentTool.name) return;
    if (!cell.plants.includes(currentTool.name)) cell.plants.push(currentTool.name);
  }
}

mapCanvas.addEventListener('mousedown', e => {
  isDrawing = true;
  const { gx, gy } = canvasCoordsToGrid(e);
  paintAt(gx, gy); redrawMap(); updateInfoPanel(gx, gy);
});
mapCanvas.addEventListener('mousemove', e => {
  const { gx, gy } = canvasCoordsToGrid(e);
  updateInfoPanel(gx, gy);
  if (isDrawing) { paintAt(gx, gy); redrawMap(); }
});
mapCanvas.addEventListener('mouseup', () => isDrawing = false);
mapCanvas.addEventListener('mouseleave', () => isDrawing = false);
mapCanvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const { gx, gy } = canvasCoordsToGrid(e);
  if (gx>=0 && gx<MAP_WIDTH && gy>=0 && gy<MAP_HEIGHT) {
    tiles[gy][gx].plants = [];
    if (e.shiftKey) tiles[gy][gx].terrain = 'sea';
    redrawMap();
  }
});

document.getElementById('btnResize').addEventListener('click', () => {
  const w = parseInt(document.getElementById('inpW').value);
  const h = parseInt(document.getElementById('inpH').value);
  if (w<1||h<1||w>200||h>200) { alert('尺寸范围 1-200'); return; }
  const old = tiles;
  MAP_WIDTH = w; MAP_HEIGHT = h;
  tiles = [];
  for (let y=0; y<h; y++) {
    const row = [];
    for (let x=0; x<w; x++) {
      row.push(old[y]&&old[y][x] ? old[y][x] : { terrain:'sea', plants:[] });
    }
    tiles.push(row);
  }
  resizeCanvas(); redrawMap();
  setStatus(`尺寸已改为 ${w}×${h}`);
});

document.getElementById('btnClear').addEventListener('click', () => {
  if (!confirm('确定清空地图？')) return;
  initMap(); redrawMap(); setStatus('已清空');
});

document.getElementById('btnExport').addEventListener('click', () => {
  const data = { width:MAP_WIDTH, height:MAP_HEIGHT, tiles:tiles };
  const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'map.bin'; a.click();
  URL.revokeObjectURL(url);
  setStatus('已导出 map.bin');
});

document.getElementById('btnImport').addEventListener('click', () => {
  document.getElementById('fileImport').click();
});
document.getElementById('fileImport').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      MAP_WIDTH = data.width; MAP_HEIGHT = data.height; tiles = data.tiles;
      document.getElementById('inpW').value = MAP_WIDTH;
      document.getElementById('inpH').value = MAP_HEIGHT;
      resizeCanvas(); redrawMap(); setStatus('导入成功');
    } catch (err) { alert('导入失败: ' + err.message); }
  };
  reader.readAsText(file);
});

document.getElementById('selLayer').addEventListener('change', e => {
  currentTool.layer = e.target.value;
  setStatus('当前图层: ' + e.target.value);
});

document.getElementById('inpZoom').addEventListener('input', e => {
  VIEW_SCALE = e.target.value / 100;
  mapCanvas.style.width = (MAP_WIDTH * TILE_SIZE * VIEW_SCALE) + 'px';
  mapCanvas.style.height = (MAP_HEIGHT * TILE_SIZE * VIEW_SCALE) + 'px';
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    renderTileList();
  });
});

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function updateInfoPanel(gx, gy) {
  document.getElementById('infoName').textContent = currentTool.name || '-';
  document.getElementById('infoTile').textContent = currentTool.group ? '('+currentTool.group+')' : '-';
  if (gx !== undefined && gy !== undefined) {
    document.getElementById('infoGrid').textContent = gx + ', ' + gy;
    if (gx>=0 && gx<MAP_WIDTH && gy>=0 && gy<MAP_HEIGHT) {
      const cell = tiles[gy][gx];
      document.getElementById('infoTerrain').textContent = cell.terrain;
      document.getElementById('infoPlants').textContent = cell.plants.join(', ') || '(无)';
    }
  }
}

(async function main() {
  await loadAllResources();
  initMap();
  resizeCanvas();
  renderTileList();
  redrawMap();
  setStatus('就绪。左键画，右键擦除');
})();
</script>
</body>
</html>
